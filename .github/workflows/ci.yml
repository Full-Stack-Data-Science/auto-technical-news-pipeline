name: CI

on:
  push:
    branches: [main, feature/scraper_pipeline_v1]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONUNBUFFERED: "1"
      
      FSDS_USERNAME: ${{ secrets.FSDS_USERNAME }}
      FSDS_PASSWORD: ${{ secrets.FSDS_PASSWORD }}
      TWITTER_EMAIL: ${{ secrets.TWITTER_EMAIL }}
      TWITTER_PASSWORD: ${{ secrets.TWITTER_PASSWORD }}
      SERVICE_BUS_CONNECTION_STRING: ${{ secrets.SERVICE_BUS_CONNECTION_STRING }}
      PROJECT_ROOT: "./test"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt

      - name: Run tests (Selenium)
        run: |         
          pytest test/unit/test_celeb_graph.py
          pytest test/intergration/test_twitter_post_extractor.py
          pytest test/intergration/test_twitter_profile_extractor.py